<h2>Course Management</h2>

<div class="panel">
  <h3>Add Course</h3>

  <form>
    <div class="form-row">
      <div class="form-group">
        <label>Course Name</label>
        <input type="text" name="name" />
      </div>

      <div class="form-group">
        <label>Course Code</label>
        <input type="text" name="code" />
      </div>

      <div class="form-group">
        <label>Duration (months)</label>
        <input type="number" name="durationMonths" min="1" />
      </div>
    </div>

    <button type="submit" class="btn-primary">Add Course</button>
  </form>
</div>

<div class="panel">
  <h3>Course List</h3>

  <table>
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Code</th>
        <th>Duration</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- one sample row - replace this with a loop over the service data -->
      <tr>
        <td>1</td>
        <td>Diploma in Information Technology</td>
        <td>DIT101</td>
        <td>12 months</td>
        <td>
          <button class="btn-small">Edit</button>
          <button class="btn-small btn-danger">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
