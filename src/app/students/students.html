<h2>Student Management</h2>

<div class="panel">
  <h3>Add Student</h3>

  <form [formGroup]="studentForm" (ngSubmit)="onSubmit(studentForm.getRawValue())">
    <div class="form-row">
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" formControlName="name" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" formControlName="email" />
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" formControlName="phone" />
      </div>

      <div class="form-group">
        <label>Address</label>
        <input type="text" name="address" formControlName="address" />
      </div>
    </div>

    <button type="submit" class="btn-primary">Add Student</button>
  </form>
</div>

<div class="panel">
  <h3>Student List</h3>

  <table>
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- one sample row - replace this with a loop over the service data -->
      <tr>
        <td>1</td>
        <td>Nithushan Janson</td>
        <td>nithushan@example.com</td>
        <td>0771234567</td>
        <td>12 Main Street, Jaffna</td>
        <td>
          <button class="btn-small">Edit</button>
          <button class="btn-small btn-danger">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
